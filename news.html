<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>競艇新聞 完全版</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Kosugi Maru', sans-serif;
  background:#eee;
}

/* 全体 */
.wrapper{
  display:flex;
  gap:16px;
  padding:10px;
  overflow-x:auto;
}

/* カード */
.paper{
  width:380px;
  border-radius:12px;
  box-shadow:6px 6px 0 #000;
  overflow:hidden;
  border:3px solid #333;
}

/* カラー */
.ikka{ background:#ffe4ec; }
.kiina{ background:#fff3a3; }
.hatsune{ background:#e3f2ff; }

/* ヘッダー */
.header{
  padding:10px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.ikka .header{background:#ff7aa8;color:#fff;}
.kiina .header{background:#ffcc00;}
.hatsune .header{background:#3aa0ff;color:#fff;}

/* セクション */
.section{
  background:#fff;
  margin:10px;
  padding:10px;
  border-radius:10px;
  border:2px solid #ccc;
}

/* 本命 */
.main{
  font-size:22px;
  font-weight:bold;
}

/* 大数字 */
.big{
  font-size:48px;
  color:#ff2e63;
  font-weight:bold;
}

/* 上昇 */
.up{color:green;font-weight:bold;}
.down{color:blue;}

/* 吹き出し */
.balloon{
  background:#fff;
  border-radius:10px;
  padding:10px;
  border:2px solid #ddd;
  margin-top:8px;
  font-size:13px;
}

/* 表 */
.table{
  font-size:13px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:3px 0;
}

/* 買い目 */
.buy{
  font-size:26px;
  font-weight:bold;
  color:red;
  text-align:center;
}

/* スタンプ */
.stamp{
  border:2px solid red;
  color:red;
  display:inline-block;
  padding:4px;
  transform:rotate(-10deg);
  margin-top:5px;
}

/* ボタン */
.btn{
  margin:10px;
  padding:10px;
  background:#000;
  color:#fff;
  border:none;
}
</style>
</head>

<body>

<h2 style="padding:10px;">競艇新聞 完全再現</h2>

<div style="padding:10px;">
<button class="btn" onclick="generate()">新聞作成</button>
</div>

<div id="output" class="wrapper"></div>

<script>

function generate(){

let data = [
{num:1,rate:84,up:31},
{num:2,rate:43,up:9},
{num:3,rate:13,up:-10},
{num:4,rate:28,up:-1},
{num:5,rate:5,up:-1},
{num:6,rate:9,up:0},
];

// ソート
let sorted=[...data].sort((a,b)=>b.rate-a.rate);

// 本命
let head = sorted[0];

// 買い目
let buy = `${sorted[0].num}-${sorted[1].num}-${sorted[2].num}`;

// 表
function table(){
return data.map(x=>{
let up = x.up>0 ? `<span class="up">+${x.up}%</span>` :
`<span class="down">${x.up}%</span>`;
return `<div class="row">
<span>${x.num}号艇</span>
<span>${x.rate}%</span>
<span>${up}</span>
</div>`;
}).join("");
}

// 一果
let ikka = `
<div class="paper ikka">
<div class="header">一果ちゃん新聞</div>

<div class="section">
<div class="main">◎${head.num}号艇</div>
<div class="big">${head.rate}%</div>
<span class="up">+${head.up}%</span>
<div class="balloon">安定感が抜けています！</div>
</div>

<div class="section table">${table()}</div>

<div class="section buy">🎯 ${buy}</div>
</div>
`;

// キイナ
let kiina = `
<div class="paper kiina">
<div class="header">キイナ速報</div>

<div class="section">
<div class="main">${head.num}強いｗ</div>
<div class="big">${head.rate}%</div>
<span class="up">+${head.up}%</span>
<div class="balloon">これマジで強いｗ</div>
</div>

<div class="section table">${table()}</div>

<div class="section buy">🔥 ${buy}</div>
</div>
`;

// 初音
let hatsune = `
<div class="paper hatsune">
<div class="header">初音AI通信</div>

<div class="section">
<div class="main">1位 ${head.num}</div>
<div class="big">${head.rate}%</div>
<span class="up">+${head.up}%</span>
<div class="balloon">統計的に優勢</div>
</div>

<div class="section table">${table()}</div>

<div class="section buy">📊 ${buy}</div>
</div>
`;

document.getElementById("output").innerHTML = ikka+kiina+hatsune;
}

generate();

</script>

</body>
</html>
